# Add to ~/.config/hypr/hyprland.conf (or Omarchy's ~/.config/hypr/autostart.conf)
exec-once = ledge

# Float + place the timer pop-out window
windowrule = float, title:^(Ledge Timer)$
windowrule = pin, title:^(Ledge Timer)$
windowrule = move 100%-280 60, title:^(Ledge Timer)$

# Optional: blur behind the notch
layerrule = blur, ledge
