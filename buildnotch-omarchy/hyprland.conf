# Omarchy 3.x (Hyprland .conf). Omarchy 4.x uses Lua: see hyprland.lua.
# Add to ~/.config/hypr/autostart.conf, bindings.conf and (rules) hyprland.conf, or run `./install.sh --hypr`.
exec-once = buildnotch

# Toggle the notch (the site's "Win + `") and open clipboard history (the site's "Win + V").
# Neither site key is free on Omarchy: SUPER+` is the scratchpad on 4.5+ and SUPER+V is Universal paste, so these
# use SUPER+ALT+N and SUPER+ALT+V (unused on Omarchy 3.8 / 4.0 / 4.5). Check `hyprctl binds` if you changed yours,
# and set "toggleHint" in config.json so the hint bar shows your key.
bind = SUPER ALT, N, global, buildnotch:toggle
bind = SUPER ALT, V, global, buildnotch:clipboard

# Float + place the pop-out focus timer (window title "BuildNotch Timer").
# Hyprland 0.53+ syntax; on older releases use: windowrulev2 = float, title:^(BuildNotch Timer)$
windowrule = float on, match:title ^(BuildNotch Timer)$
windowrule = pin on, match:title ^(BuildNotch Timer)$
windowrule = move (monitor_w-320) 80, match:title ^(BuildNotch Timer)$

# Optional: blur behind the notch (older: layerrule = blur, buildnotch)
layerrule = blur on, match:namespace buildnotch
